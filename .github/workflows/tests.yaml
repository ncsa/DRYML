name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: test_requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt

      - name: Install DRYML
        run: |
          python -m pip install .

      - name: Show Dependency Versions
        run: |
          python - <<'PY'
          from importlib import metadata

          for package in ("tensorflow", "keras", "jax", "jaxlib", "torch", "triton"):
              try:
                  version = metadata.version(package)
              except metadata.PackageNotFoundError:
                  version = "not installed"
              print(f"{package}: {version}")
          PY

      - name: Installed Package Smoke Test
        run: |
          python - <<'PY'
          import importlib.util
          import dryml
          import dryml.core2.store.store
          import dryml.core2.utils.general

          assert hasattr(dryml, "core2")
          assert importlib.util.find_spec("dryml.data.transforms") is None
          PY

      - name: Run Tests
        shell: bash
        run: |
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            ./tests.sh measure --output-dir "$RUNNER_TEMP/dryml-measure" full --cov-report=xml --cov-report=html
          else
            ./tests.sh measure --output-dir "$RUNNER_TEMP/dryml-measure" --no-coverage full
          fi

      - name: Upload Timing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-linux-py${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/dryml-measure
          if-no-files-found: warn
          retention-days: 14

      - name: Send Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/dryml-measure/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          verbose: true

  windows-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test_requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt

      - name: Install DRYML
        run: |
          python -m pip install .

      - name: Run Full Test Suite
        shell: bash
        run: ./tests.sh measure --output-dir "$RUNNER_TEMP/dryml-measure" --no-coverage full

      - name: Upload Timing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-windows-py3.12-${{ github.sha }}
          path: ${{ runner.temp }}/dryml-measure
          if-no-files-found: warn
          retention-days: 14
