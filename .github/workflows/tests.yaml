name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: good-enough
        type: choice
        options:
          - good-enough
          - exhaustive
          - coverage

permissions:
  contents: read

# Snapshot fixture paths exceed Git for Windows' legacy checkout limit.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

defaults:
  run:
    shell: bash

jobs:
  lightweight:
    name: Lightweight (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Durable Store publication adds filesystem work on slower Windows runners.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt
          python -m pip install .

      - name: Show resolved versions
        run: |
          python - <<'PY'
          import platform
          from importlib import metadata

          print(f"python: {platform.python_version()}")
          print(f"dryml: {metadata.version('dryml')}")
          PY

      - name: Run lightweight tests
        env:
          REQUESTED_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'good-enough' }}
        run: |
          if [[ "$REQUESTED_SUITE" == "good-enough" ]]; then
            ./tests.sh good-enough --ignore tests/old --ignore tests/dev -x -vv --timeout=180 --timeout-method=thread
          else
            ./tests.sh medium --ignore tests/old --ignore tests/dev -x -vv --timeout=180 --timeout-method=thread
          fi

  local-filesystem-publication:
    name: Good-enough (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install Bash for named test suites
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install publication test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt
          python -m pip install ".[test]"

      - name: Run good-enough including native publication tests
        run: |
          bash ./tests.sh good-enough --ignore tests/old --ignore tests/dev -x -vv --timeout=180 --timeout-method=thread

      - name: Run package-only tests
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'exhaustive' || inputs.suite == 'coverage')
        run: |
          bash ./tests.sh package --ignore tests/old --ignore tests/dev -x -vv --timeout=180 --timeout-method=thread

  heavy:
    name: Heavy frameworks (Ubuntu, Python ${{ matrix.python-version }})
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'exhaustive' || inputs.suite == 'coverage')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install framework dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt -r heavy_test_requirements.txt
          python -m pip install .

      - name: Require frameworks and show resolved versions
        run: |
          python - <<'PY'
          import platform
          from importlib import metadata
          import jax
          import jaxlib
          import ray
          import tensorflow
          import torch

          print(f"python: {platform.python_version()}")
          for package in ("dryml", "tensorflow", "jax", "jaxlib", "torch", "ray"):
              print(f"{package}: {metadata.version(package)}")
          PY

      - name: Run heavy framework tests
        run: |
          ./tests.sh heavy --ignore tests/old --ignore tests/dev -x

  ray-integration:
    name: Existing Ray integration (Ubuntu, Python 3.12)
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'exhaustive' || inputs.suite == 'coverage')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      - name: Set up coordinator Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: dryml-ray
          auto-activate-base: false
          python-version: "3.12"

      - name: Build and install the test artifact in existing targets
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ray_test_requirements.txt
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          export VENV_ROOT="$RUNNER_TEMP/dryml-ray-venv"
          python -m venv "$VENV_ROOT"
          export VENV_PYTHON="$VENV_ROOT/bin/python"
          "$VENV_PYTHON" -m pip install --upgrade pip
          "$VENV_PYTHON" -m pip install -r ray_test_requirements.txt
          "$VENV_PYTHON" -m pip install --force-reinstall dist/*.whl

      - name: Start job-owned Ray test server
        run: |
          ray start --head --port=6379 --num-cpus=4 --num-gpus=0 --object-store-memory=100000000 --temp-dir="$RUNNER_TEMP/dryml-ray" --disable-usage-stats

      - name: Run enabled existing-Ray integration
        run: |
          export CONDA_PREFIX
          export VENV_PYTHON="$RUNNER_TEMP/dryml-ray-venv/bin/python"
          export DRYML_EXECUTE_INTEGRATION=1
          export DRYML_TEST_RAY_ADDRESS=127.0.0.1:6379
          export DRYML_TEST_CONDA_PREFIX="$CONDA_PREFIX"
          export DRYML_TEST_VENV_PYTHON="$VENV_PYTHON"
          ./tests.sh tests/ray/test_core_execute_ray.py tests/ray/test_execute_ray_backend.py tests/ray/test_execute_ray_environments.py tests/ray/test_dispatch_ray.py tests/core/test_execute_integration.py tests/execute/test_backend_conformance.py tests/execute/test_existing_environments.py --ignore tests/old --ignore tests/dev -x

      - name: Stop job-owned Ray test server
        if: always()
        run: |
          ray stop --force

  coverage:
    name: Coverage (Ubuntu, Python 3.12)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'coverage'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test and heavy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt -r heavy_test_requirements.txt
          python -m pip install .

      - name: Run combined coverage
        run: |
          ./tests.sh coverage --ignore tests/old --ignore tests/dev -x -vv --timeout=180 --timeout-method=thread
