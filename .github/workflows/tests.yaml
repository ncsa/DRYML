          forbidden_suffixes = {".pyc", ".pkl", ".pickle", ".db", ".sqlite", ".sqlite3"}
          for path in files:
              relative = path.relative_to(root)
              assert not forbidden_parts.intersection(relative.parts), relative
              assert path.suffix.lower() not in forbidden_suffixes, relative
          PY

      - name: Upload Timing Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timing-windows-py3.12-${{ github.sha }}
          path: ${{ runner.temp }}/dryml-measure
          if-no-files-found: error
          retention-days: 14
