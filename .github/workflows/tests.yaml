name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt

      - name: Install DRYML
        run: |
          python -m pip install .

      - name: Show Dependency Versions
        run: |
          python - <<'PY'
          from importlib import metadata

          for package in ("tensorflow", "keras", "jax", "jaxlib", "torch", "triton"):
              try:
                  version = metadata.version(package)
              except metadata.PackageNotFoundError:
                  version = "not installed"
              print(f"{package}: {version}")
          PY

      - name: Installed Package Smoke Test
        run: |
          python - <<'PY'
          import importlib.util
          import dryml
          import dryml.core.store.store
          import dryml.core.utils.general

          assert hasattr(dryml, "core")
          assert importlib.util.find_spec("dryml.data.transforms") is None
          PY

      - name: Run Tests
        run: |
          ./tests.sh --cov-report=xml --cov-report=html

      - name: Send Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
