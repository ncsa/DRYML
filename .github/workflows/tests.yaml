name: Tests

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lightweight:
    name: Lightweight (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt
          python -m pip install .

      - name: Show resolved versions
        run: |
          python - <<'PY'
          import platform
          from importlib import metadata

          print(f"python: {platform.python_version()}")
          print(f"dryml: {metadata.version('dryml')}")
          PY

      - name: Run lightweight and package tests
        run: |
          ./tests.sh medium --ignore tests/old --ignore tests/dev -x

  local-filesystem-publication:
    name: Local filesystem publication (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install publication test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt
          python -m pip install .

      - name: Run local filesystem publication focus
        run: |
          ./tests.sh tests/core/test_store_format.py tests/core/test_store_direct_layout.py tests/core/test_store_atomic_publication.py tests/core/test_state_ref_save.py tests/core/test_graph_save_failure.py tests/core/test_repo_claim_concurrency.py tests/core/test_repo_reference_aliases.py tests/core/test_pre_port_store_rejection.py -x

  heavy:
    name: Heavy frameworks (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install framework dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_requirements.txt -r heavy_test_requirements.txt
          python -m pip install .

      - name: Require frameworks and show resolved versions
        run: |
          python - <<'PY'
          import platform
          from importlib import metadata
          import jax
          import jaxlib
          import ray
          import tensorflow
          import torch

          print(f"python: {platform.python_version()}")
          for package in ("dryml", "tensorflow", "jax", "jaxlib", "torch", "ray"):
              print(f"{package}: {metadata.version(package)}")
          PY

      - name: Run heavy framework tests
        run: |
          ./tests.sh heavy --ignore tests/old --ignore tests/dev -x
